repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^backend/tests/fixtures/
      - id: trailing-whitespace
        exclude: ^backend/tests/fixtures/
      - id: check-yaml
        exclude: ^backend/dbt/
      - id: check-added-large-files
        args: [--maxkb=1500]
