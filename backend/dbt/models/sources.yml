version: 2

sources:
  - name: bronze
    description: >
      Raw layer. Parquet files written by the Python extractors (`cmdp.extract`), one folder
      per source and series, partitioned by load date. Values are kept as text exactly as the
      source returned them.
    tables:
      - name: boc_valet
        description: Raw Bank of Canada Valet observations (policy rate, CORRA, bond yields, FX).
        meta:
          external_location: "read_parquet('{{ env_var('CMDP_BRONZE_PATH', '../../data/bronze') }}/boc_valet/**/*.parquet', hive_partitioning = true, union_by_name = true)"
          dagster:
            asset_key: ["bronze", "boc_valet"]
        columns:
          - name: series_key
            description: Platform series key (see config/series.yaml).
          - name: source_id
            description: Valet series name, for example BD.CDN.10YR.DQ.YLD.
          - name: obs_date
            description: Observation date as text (YYYY-MM-DD).
          - name: value_raw
            description: Observation value as text, null when the source returned no value.
          - name: load_id
            description: Identifier of the extract run that wrote the row.
          - name: loaded_at
            description: UTC time of the extract run.
          - name: source_url
            description: Exact URL that was requested.
      - name: statcan_wds
        description: Raw Statistics Canada WDS data points for CPI table 18-10-0004-01.
        meta:
          external_location: "read_parquet('{{ env_var('CMDP_BRONZE_PATH', '../../data/bronze') }}/statcan_wds/**/*.parquet', hive_partitioning = true, union_by_name = true)"
          dagster:
            asset_key: ["bronze", "statcan_wds"]
      - name: load_log
        description: One row per series per extract run with row counts, date range and source URL.
        meta:
          external_location: "read_parquet('{{ env_var('CMDP_BRONZE_PATH', '../../data/bronze') }}/_loads/**/*.parquet', hive_partitioning = true, union_by_name = true)"
          dagster:
            asset_key: ["bronze", "load_log"]
      - name: series_catalog
        description: The series catalog from config/series.yaml, written by the pipeline.
        meta:
          external_location: "read_parquet('{{ env_var('CMDP_BRONZE_PATH', '../../data/bronze') }}/_meta/series_catalog.parquet')"
          dagster:
            asset_key: ["bronze", "series_catalog"]
      - name: calendar
        description: Bank of Canada business-day calendar generated by cmdp.calendar.
        meta:
          external_location: "read_parquet('{{ env_var('CMDP_BRONZE_PATH', '../../data/bronze') }}/_meta/calendar.parquet')"
          dagster:
            asset_key: ["bronze", "calendar"]
