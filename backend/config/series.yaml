  - key: CPI_ALL
    source_id: "41690973"
    source: statcan_wds
    category: cpi
    name: CPI, all-items (Canada)
    unit: index (2002=100)
    unit_multiplier: 1.0
    frequency: monthly
    freshness_max_business_days: 65   # CPI is released ~3 weeks after month end
    anomaly_check: false
    range: [0.0, 1000.0]
    description: Consumer Price Index, all-items, Canada, not seasonally adjusted. Table 18-10-0004-01.

