    description: Selected benchmark bond yield for the 10-year Government of Canada bond.

  - key: GOC_LONG
    source_id: BD.CDN.LONG.DQ.YLD
    source: boc_valet
    category: bond_yield
    name: Government of Canada benchmark bond yield, long-term
    unit: percent
    unit_multiplier: 1.0
    frequency: daily
    freshness_max_business_days: 5
    anomaly_check: true
    range: [-1.0, 20.0]
    description: Selected benchmark bond yield for the long-term (30-year) Government of Canada bond.

  - key: FX_USDCAD
    source_id: FXUSDCAD
    source: boc_valet
    category: fx
    name: USD/CAD daily exchange rate
    unit: CAD per USD
    unit_multiplier: 1.0
    frequency: daily
    freshness_max_business_days: 5
    anomaly_check: true
    range: [0.000001, 1000.0]
    description: Bank of Canada daily average exchange rate, Canadian dollars per US dollar. Available from 2017-01-03.

  - key: FX_EURCAD
    source_id: FXEURCAD
    source: boc_valet
