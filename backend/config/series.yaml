# Series catalog for the Canada Markets Data Platform.
# Every Bank of Canada ID below was confirmed against
#   https://www.bankofcanada.ca/valet/lists/series/json  (and /lists/groups/json)
# and every Statistics Canada vector against the WDS getSeriesInfoFromVector endpoint
# (table 18-10-0004-01, Consumer Price Index, monthly, not seasonally adjusted).
#
# Fields
#   key            short stable key used across the warehouse and the API
#   source_id      identifier at the source (Valet series name or StatCan vector id)
#   source         boc_valet | statcan_wds
#   category       policy_rate | money_market | bond_yield | fx | cpi
#   unit           standardised unit stored in the warehouse
#   unit_multiplier  multiply the raw value by this to reach `unit`
#   frequency      daily (Canadian business days) | monthly
#   freshness_max_business_days  freshness threshold used by the DQ check
#   anomaly_check  include in the 5-sigma day-over-day anomaly check
#   range          plausible value range for the range check

start_date: "2015-01-01"

series:
  - key: POLICY_RATE
    source_id: V39079
    source: boc_valet
    category: policy_rate
    name: Target for the overnight rate
    unit: percent
    unit_multiplier: 1.0
    frequency: daily
    freshness_max_business_days: 5
    anomaly_check: false   # a step series: every decision would be a "5-sigma" move
    range: [-1.0, 20.0]
    description: The Bank of Canada policy interest rate (business daily).

  - key: CORRA
    source_id: AVG.INTWO
    source: boc_valet
    category: money_market
    name: Canadian Overnight Repo Rate Average (CORRA)
    unit: percent
    unit_multiplier: 1.0
    frequency: daily
    freshness_max_business_days: 5
    anomaly_check: true
    range: [-1.0, 20.0]
    description: Measure of the cost of overnight general collateral funding in Canadian dollars.

  - key: GOC_2Y
    source_id: BD.CDN.2YR.DQ.YLD
    source: boc_valet
    category: bond_yield
    name: Government of Canada benchmark bond yield, 2-year
    unit: percent
    unit_multiplier: 1.0
    frequency: daily
    freshness_max_business_days: 5
    anomaly_check: true
    range: [-1.0, 20.0]
    description: Selected benchmark bond yield for the 2-year Government of Canada bond.

  - key: GOC_5Y
    source_id: BD.CDN.5YR.DQ.YLD
    source: boc_valet
    category: bond_yield
    name: Government of Canada benchmark bond yield, 5-year
    unit: percent
    unit_multiplier: 1.0
    frequency: daily
    freshness_max_business_days: 5
    anomaly_check: true
    range: [-1.0, 20.0]
    description: Selected benchmark bond yield for the 5-year Government of Canada bond.

  - key: GOC_10Y
    source_id: BD.CDN.10YR.DQ.YLD
    source: boc_valet
    category: bond_yield
    name: Government of Canada benchmark bond yield, 10-year
    unit: percent
    unit_multiplier: 1.0
    frequency: daily
    freshness_max_business_days: 5
    anomaly_check: true
