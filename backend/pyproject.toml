[project]
name = "cmdp"
version = "0.1.0"
description = "Canada Markets Data Platform: Bank of Canada and Statistics Canada data pipeline, star schema, data quality and API."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "polars>=1.0",
  "duckdb>=1.1",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "holidays>=0.50",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
  "dagster>=1.9",
  "dagster-webserver>=1.9",
  "dagster-dbt>=0.25",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "pyarrow>=16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmdp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "SIM"]
ignore = ["D203", "D213", "D107", "D105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
markers = ["slow: runs dbt end to end on fixtures"]

[tool.dagster]
module_name = "cmdp.orchestration.definitions"
