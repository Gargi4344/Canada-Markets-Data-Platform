# docker compose up --build
#   API:       http://localhost:8000/docs   (loads real data from 2015 on first start)
#   Dashboard: http://localhost:3000
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CMDP_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
